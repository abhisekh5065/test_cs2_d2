<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let employee1 = {id:100,name:"Raj",age:21,isActive:true}
        let employee2 = {id:101,name:"Ravi",age:22,isActive:false}

        document.write("<br/> Object in literal style<br/>")
        document.write("<br/> Id is "+employee1.id)
        document.write("<br/> Name is "+employee1.name)
        document.write("<br/> Age is "+employee1.age)
        document.write("<br/> IsActive is "+employee1.isActive)
        document.write("<br/> Id is "+employee2.id)
        document.write("<br/> Name is "+employee2.name)
        document.write("<br/> Age is "+employee2.age)
        document.write("<br/> IsActive is "+employee2.isActive)

         let employee3 = {id:102,name:"John",age:23,isActive:true,displayEmployee:function(){
                document.write("<br/> 3rd Employee details")
                document.write("<br/> id is "+this.id)
                document.write("<br/> name is "+this.name)
                document.write("<br/> age is "+this.age)
                document.write("<br/> isActive is "+this.isActive)
        }}
        employee3.displayEmployee();
    </script>
</body>
</html>
