<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="Register event on HTML Side" id="b1"
    onclick="fun1()"/>
    <input type="button" value="Register event on Js Side" id="b2"/>

     <input type="text" id="n11" placeholder="Enter name"/>
    <input type="button" value="Add" onclick="addContent()"/>
    <hr/>
    <div id="result"></div>

    <script>
        function fun1() {
            //alert("Event fired1")
        }
        function fun2() {
            //alert("Event fired2")
        }
        let buttonRef = document.getElementById("b2")
        buttonRef.addEventListener("click",fun2)
        /*buttonRef.addEventListener("click",()=> {
            alert("Event fired")
        })*/

        function addContent() {
               // alert("Event generated")
               let name = document.getElementById("n11").value
               // creating new tag 
               let pTag = document.createElement("p")       //<p></p>
               //let pTagContent = document.createTextNode("Welcome")  // Welcome 
               let pTagContent = document.createTextNode(name)
               pTag.appendChild(pTagContent)            // <p>Welcome </p>
               document.getElementById("result").appendChild(pTag)  // <div><p>Welcome</p></div>
               document.getElementById("n11").value=""
            }
    </script>
</body>
</html>
