<!DOCTYPE html>

<html>

<head>

    <title>Product Card</title>

    <!--<link rel="stylesheet" href="box_model.css">-->
    <style>

        * {

    box-sizing: border-box;

}

body {

    font-family: Arial, sans-serif;

    background-color: #f2f2f2;

}

/* BOX MODEL */

.product-card {

    

    width: 320px;

    /* Space inside the box */

    padding: 20px;

    /* Boundary of the box */

    border: 2px solid #ddd;

    /* Space outside the box */

    margin: 50px auto;

    background-color: white;

    border-radius: 10px;

    box-shadow: 0 10px 10px rgba(87, 22, 22, 0.15);

}

.product-card img {

    width: 100%;

}

.product-card h2 {

    margin-top: 15px;

}

.description {

    color: #555;

    line-height: 1.5;

}

.price {

    font-size: 24px;

    font-weight: bold;

}

 

.product-card button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 5px;

    background-color: #ff9900;

    color: white;

    cursor: pointer;

}
    </style>

</head>

<body>

        <div class="product-card">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVYMlW7hnT_bx7WAPuR2IZVWv4KpvI7-vbSYuXvQ3evg&s=10"

             alt="Laptop">

        <h2>HP Laptop</h2>

        <p class="description">

            HP Laptop with Intel Core i5 processor,

            16GB RAM and 512GB SSD.

        </p>

        <p class="price">$5,999</p>

        <button>Add to Cart</button>

    </div>

    

</body>

</html>
