<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        div{

            border-style: dotted;
            border-width: 5px;
            border-color: red;
            margin : 5px;
            padding : 10px;
            width : 150px;
            display : inline-block;
        }

        p{
            border: solid 2px blue;
            padding: 10px;
            margin: 0px;
            width : 20%;
            display : inline-block;
        }

    </style>

</head>

<body>

    <div>First Div Tag</div>
    <div>Second Div Tag</div>
    <div>Third Div Tag</div>

    <hr/>
    
    <p>First Paragraph Tag</p>
    <p>Second Paragraph Tag</p>
    <p>Third Paragraph Tag</p>
    <p>Fourth Paragraph Tag</p>

</body>

</html>
