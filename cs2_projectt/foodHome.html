
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food App</title>

    <link rel="stylesheet" href="style.css">

    <script src="foodApp.js" defer></script>
</head>

<body onload="loadFoodDetails()">

    <header class="header">
        <h1>Online Food App</h1>
        <p>Discover delicious food recipes</p>
    </header>

    <main class="container">

        <h2>Explore Our Menu</h2>

        <div class="search-box">
            <input type="text" id="foodName"
            placeholder="Search food name...">
        </div>

        <section id="result" class="food-container"></section>

    </main>

    <footer class="footer">
        <p>© 2026 Online Food App | All Rights Reserved</p>
    </footer>

</body>
</html>
